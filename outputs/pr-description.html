    const raw = "\u003c!-- SDLC Pipeline Artifact\n     Stage: 13-pr-assembler\n     Source PRD: inputs/prd.md\n     PRD Sections: All (§1–§10)\n     Generated: 2026-06-26\n     Status: READY FOR REVIEW\n--\u003e\n\n# PR: TCPA Regulatory Compliance API — Phase 1 Initial Delivery\n\n## Summary\n\nThis PR delivers the TCPA Regulatory Compliance API (Phase 1), a centralized\nSMS compliance middleware that enforces TCPA Section 64.1200 opt-out rules\nacross all Southern Company Gas applications. Every outbound SMS from BizTalk,\nGCMA, KMI Active, and ARM/Construction Portal is now gated through this API\nbefore reaching Cool Text/Twilio; any customer who sends an opt-out keyword\n(STOP, QUIT, END, REVOKE, OPT-OUT, CANCEL, UNSUBSCRIBE) is immediately blocked\nacross all SCG applications and receives a confirmation within 60 seconds. This\nis a mandatory regulatory compliance system — it must be live and enforcing by\nJanuary 31, 2027.\n\n---\n\n## ⚠️ Human Approval Required\n\nThis PR was generated by an automated SDLC pipeline. It requires explicit human\nreview and approval before merge. **Do not auto-merge.** A compliance officer\nand the Architecture Lead must both sign off before merge. Blocking and\nSecurity-Blocking findings were resolved in-session; four Important findings\nand three High security findings remain open (documented below) and require\nowner acknowledgement before this PR proceeds.\n\n---\n\n## What Changed\n\n### Features Delivered\n\n| Story           | Description                                              | Priority  | Specs                   |\n|-----------------|----------------------------------------------------------|-----------|-------------------------|\n| STORY-001       | Application Registry — lookup and in-memory cache        | Must Have | SPEC-014                |\n| STORY-002       | Outbound SMS compliance gate (forward / suppress / 503)  | Must Have | SPEC-001, SPEC-006      |\n| STORY-003       | Inbound SMS webhook — HMAC validation + app routing      | Must Have | SPEC-002                |\n| STORY-003-SPIKE | Cool Text webhook signing mechanism confirmation         | Must Have | ADR-007, ARCH-RISK-004  |\n| STORY-004       | Opt-out keyword detection (7 TCPA keywords, word-boundary) | Must Have | SPEC-003               |\n| STORY-005       | Opt-out status write (global, idempotent, fail-safe)     | Must Have | SPEC-004                |\n| STORY-006       | Opt-out confirmation SMS dispatch (60-second SLA)        | Must Have | SPEC-005                |\n| STORY-007       | BizTalk REST adapter feasibility spike                   | Must Have | RISK-001, ARCH-RISK-001 |\n| STORY-008       | Admin IdP and RBAC setup spike                           | Must Have | RISK-014, SPEC-007      |\n| STORY-009       | Re-opt-in status lookup (read-only, masked PII)          | Must Have | SPEC-007 (GET)          |\n| STORY-010       | Re-opt-in status update (privileged write)               | Must Have | SPEC-007 (PUT), SPEC-010|\n| STORY-011       | Opt-out event audit log entry                            | Must Have | SPEC-008                |\n| STORY-012       | Blocked outbound SMS audit log entry                     | Must Have | SPEC-009                |\n| STORY-013       | Re-opt-in event audit log entry                          | Must Have | SPEC-010                |\n| STORY-014       | On-demand report — forwarded SMS to opted-in numbers     | Must Have | SPEC-011                |\n| STORY-015       | On-demand report — blocked SMS to opted-out numbers      | Must Have | SPEC-012                |\n| STORY-016       | Automated weekly compliance report (Monday 06:00 UTC)    | Must Have | SPEC-013                |\n| STORY-017       | Application Registry — initial seed (5 SCG applications) | Must Have | SPEC-014                |\n| STORY-018       | CCB TCPA activation gate process document                | Must Have | SPEC-014 (BR-063)       |\n| STORY-019       | Structured operational logging with PII masking          | Must Have | SPEC-015, NFS-010       |\n| STORY-020       | Debug logging toggle (no restart)                        | Must Have | SPEC-015, NFS-010       |\n| STORY-021       | Health check endpoint (`GET /health`)                    | Must Have | SPEC-015, NFS-009       |\n| STORY-022       | PII encryption at rest + TLS enforcement                 | Must Have | NFS-007                 |\n| STORY-023       | Audit log immutability + 5-year retention policy         | Must Have | NFS-004, NFS-008        |\n\nAll 24 stories are Must Have. All are included in this PR.\n\n---\n\n### Files Changed\n\n#### Source — TCPA.Api project (57 implementation files)\n\n| File | Type | Story | Description |\n|------|------|-------|-------------|\n| `src/TCPA.Api/Program.cs` | New | All | Application host: EF Core, Serilog, JWT Bearer, health checks, Key Vault, App Config |\n| `src/TCPA.Api/TCPA.Api.csproj` | New | All | .NET 8 Web API project with NuGet references |\n| `src/TCPA.Api/appsettings.json` | New | All | Base config (all values empty — populated from Key Vault) |\n| `src/TCPA.Api/appsettings.Development.json` | New | All | Dev overrides: Debug log level, LocalDB connection |\n| `src/TCPA.Api/Controllers/OutboundSmsController.cs` | New | STORY-002 | POST /api/v1/sms/outbound |\n| `src/TCPA.Api/Controllers/InboundSmsController.cs` | New | STORY-003 | POST /api/v1/sms/inbound; HMAC validation; fire-and-forget |\n| `src/TCPA.Api/Controllers/AdminController.cs` | New | STORY-009/010 | PUT /admin/v1/opt-out/re-opt-in; GET /admin/v1/opt-out/status/{cell} |\n| `src/TCPA.Api/Controllers/ReportingController.cs` | New | STORY-014/015 | GET /api/v1/reports/opted-in and /opted-out |\n| `src/TCPA.Api/Controllers/HealthController.cs` | New | STORY-021 | GET /health (anonymous) |\n| `src/TCPA.Api/Domain/ApplicationRegistration.cs` | New | STORY-001/017 | EF Core entity; Always Encrypted PII notes |\n| `src/TCPA.Api/Domain/CellNumberOptOutRecord.cs` | Ne e.cs` | New | STORY-005 | EF Core-backed; idempotent; fail-closed on DB error |\n| `src/TCPA.Api/Services/OptOut/IOptOutStatusService.cs` | New | STORY-005 | Interface + WriteOptOutResult record |\n| `src/TCPA.Api/Services/OptOut/ConfirmationDispatcher.cs` | New | STORY-006 | SLA-aware; config-driven message text; single retry |\n| `src/TCPA.Api/Services/OptOut/IConfirmationDispatcher.cs` | New | STORY-006 | Interface + ConfirmationDispatchResult record |\n| `src/TCPA.Api/Services/SmsProxy/InboundSmsHandler.cs` | New | STORY-003/004/005/006 | Full inbound pipeline: detect → write → confirm → audit → forward |\n| `src/TCPA.Api/Services/SmsProxy/IInboundSmsHandler.cs` | New | STORY-003 | Interface |\n| `src/TCPA.Api/Services/SmsProxy/OutboundSmsGate.cs` | New | STORY-002/012 | Registry lookup → IsOptedOut → suppress/forward; fail-closed |\n| `src/TCPA.Api/Services/SmsProxy/IOutboundSmsGate.cs` | New | STORY-002 | Interface + OutboundGateResult / Decision types |\n| `src/TCPA.Api/Services/ReOptIn/ReOptInService.cs` | New | STORY-009/010 | Status lookup; re-opt-in write; 409 for no-record; idempotent |\n| `src/TCPA.Api/Services/ReOptIn/IReOptInService.cs` | New | STORY-009/010 | Interface + result records |\n| `src/TCPA.Api/Services/AuditLog/AuditLogService.cs` | New | STORY-011/012/013 | Append-only; throws AuditLogWriteException on failure; PII masked |\n| `src/TCPA.Api/Services/AuditLog/IAuditLogService.cs` | New | STORY-011/012/013 | Write-only interface (no Update/Delete) |\n| `src/TCPA.Api/Services/AuditLog/AuditLogWriteException.cs` | New | STORY-011 | Typed exception with EventType and CorrelationId |\n| `src/TCPA.Api/Services/Reporting/ReportingService.cs` | New | STORY-014/015/016 | Queries ForwardedSms and BlockedSms projections; staleness check |\n| `src/TCPA.Api/Services/Reporting/IReportingService.cs` | New | STORY-014/015/016 | Interface |\n| `src/TCPA.Api/Services/Reporting/ReportEmailer.cs` | New | STORY-016 | SMTP; HTML email + CSV attachment; credentials from Key Vault |\n| `src/TCPA.Api/Services/Reporting/IReportEmailer.cs` | New | STORY-016 | Interface |\n| `src/TCPA.Api/Services/Reporting/ReportEmailDispatchException.cs` | New | STORY-016 | Typed exception for SMTP failures |\n| `src/TCPA.Api/Services/Reporting/ComplianceReportModels.cs` | New | STORY-014/015/016 | All report model types |\n| `src/TCPA.Api/Services/Observability/CorrelationIdMiddleware.cs` | New | STORY-019 | UUID per request; X-Correlation-ID header; Serilog scope |\n| `src/TCPA.Api/Services/Observability/CorrelationIdAccessor.cs` | New | STORY-019 | Scoped implementation |\n| `src/TCPA.Api/Services/Observability/ICorrelationIdAccessor.cs` | New | STORY-019 | Interface |\n\n#### Source — TCPA.Scheduler project (3 files)\n\n| File | Type | Story | Description |\n|------|------|-------|-------------|\n| `src/TCPA.Scheduler/WeeklyComplianceReportFunction.cs` | New | STORY-016 | Azure Functions timer: `0 6 * * 1` (Monday 06:00 UTC) |\n| `src/TCPA.Scheduler/ManualReportTriggerFunction.cs` | New | STORY-016 | HTTP trigger for manual re-run; auth-protected |\n| `src/TCPA.Scheduler/local.settings.json` | New | STORY-016 | Placeholders only — no credentials present |\n\n#### Tests (15 test files)\n\n| File | Type | Stories | Tests |\n|------|------|---------|-------|\n| `tests/TCPA.Api.Tests/Unit/CoolText/CoolTextWebhookValidatorTests.cs` | New | STORY-003 | HMAC validation |\n| `tests/TCPA.Api.Tests/Unit/OptOut/OptOutDetectorTests.cs` | New | STORY-004 | Keyword detection |\n| `tests/TCPA.Api.Tests/Unit/OptOut/OptOutStatusServiceTests.cs` | New | STORY-005 | Status write |\n| `tests/TCPA.Api.Tests/Unit/OptOut/ConfirmationDispatcherTests.cs` | New | STORY-006 | Confirmation dispatch + SLA |\n| `tests/TCPA.Api.Tests/Unit/ReOptIn/ReOptInServiceTests.cs` | New | STORY-009/010 | Re-opt-in write |\n| `tests/TCPA.Api.Tests/Unit/Controllers/AdminControllerTests.cs` | New | STORY-009/010 | Admin API controller |\n| `tests/TCPA.Api.Tests/Unit/SmsProxy/InboundSmsHandlerTests.cs` | New | STORY-003/004 | Inbound routing |\n| `tests/TCPA.Api.Tests/Unit/SmsProxy/OutboundSmsGateTests.cs` | New | STORY-002 | Compliance gate |\n| `tests/TCPA.Api.Tests/Unit/Controllers/InboundSmsControllerTests.cs` | New | STORY-003 | Inbound controller |\n| `tests/TCPA.Api.Tests/Unit/Controllers/OutboundSmsControllerTests.cs` | New | STORY-002 | Outbound controller |\n| `tests/TCPA.Api.Tests/Unit/AuditLog/AuditLogServiceTests.cs` | New | STORY-011/012/013 | Audit log service |\n| `tests/TCPA.Api.Tests/Unit/Configuration/ApplicationRegistryServiceTests.cs` | New | STORY-001/017 | Registry cache + startup |\n| `tests/TCPA.Api.Tests/Unit/Reporting/ReportingServiceTests.cs` | New | STORY-014/015/016 | Reporting service |\n| `tests/TCPA.Api.Tests/Unit/Reporting/WeeklyReportFunctionTests.cs` | New | STORY-016 | Period calculation + dispatch |\n| `tests/TCPA.Api.Tests/Unit/Controllers/HealthControllerTests.cs` | New | STORY-021 | Health check |\n\n#### Documentation\n\n| File | Type | Description |\n|------|------|-------------|\n| `outputs/docs/README.md` | New | Quickstart, test instructions, config overview |\n| `outputs/docs/api.md` | New | 7 endpoints documented with request/response schemas |\n| `outputs/docs/architecture.md` | New | Developer-facing architecture summary |\n| `outputs/docs/operations.md` | New | Env vars, health check, log events, failure modes |\n| `outputs/docs/CHANGELOG.md` | New | Version 1.0.0 release notes |\n\n---\n\n## Why These Changes\n\nSouthern Company Gas is legally required to comply with TCPA Section 64.1200\nby January 31, 2027. Five SCG applications (BizTalk, GCMA, KMI Active,\nARM/Construction Portal, CCB/My Account) currently send SMS to customers\nwithout any centralized opt-out enforcement. An opted-out customer can still\nreceive messages from any of these applications because there is no shared\nopt-out registry. This API closes that gap.\n\nThe business goals this delivery satisfies (from `outputs/requirements.md`):\n- **GOAL-1:** Zero SMS messages delivered to opted-out cell numbers via the TCPA API.\n- **GOAL-2:** 100% of in-scope application messages routed through TCPA API.\n- **GOAL-3:** Audit log retained 5 years; weekly compliance reports with zero manual intervention.\n- **GOAL-4:** Opt-out acknowledgement ≤ 60 seconds; opt-out effective within 10 days.\n\n**PRD Traceability:**\n\n| Requirement | Story          | Spec(s)          | Implemented |\n|-------------|----------------|------------------|-------------|\n| REQ-001     | STORY-001/002  | SPEC-001         | ✅          |\n| REQ-002     | STORY-003      | SPEC-002         | ✅          |\n| REQ-003     | STORY-004      | SPEC-003         | ✅          |\n| REQ-004     | STORY-005      | SPEC-004         | ✅          |\n| REQ-005     | STORY-006      | SPEC-005         | ✅          |\n| REQ-006     | STORY-002/005  | SPEC-001/004     | ✅          |\n| REQ-007     | STORY-006      | SPEC-005         | ⚠️ Text pending Legal approval (open item) |\n| REQ-008     | STORY-002      | SPEC-001/006     | ✅          |\n| REQ-009     | STORY-011      | SPEC-008         | ⚠️ RecordId bug fixed in-session (CR-005) |\n| REQ-010     | STORY-012      | SPEC-009         | ✅          |\n| REQ-011     | STORY-023      | NFS-004          | ✅          |\n| REQ-012     | STORY-009/010  | SPEC-007         | ✅          |\n| REQ-013     | STORY-014      | SPEC-011         | ✅          |\n| REQ-014     | STORY-015      | SPEC-012         | ✅          |\n| REQ-015     | STORY-016      | SPEC-013         | ⚠️ CSV format and compliance failure detection fixed in-session (CR-008/009) |\n| REQ-016     | STORY-001/017  | SPEC-014         | ✅          |\n| REQ-017     | STORY-019/020  | SPEC-015         | ✅          |\n| REQ-018     | STORY-001      | SPEC-014         | ✅          |\n\n---\n\n## Testing Evidence\n\n### Test Summary\n- Unit tests added: 145 (81 Foundation/Compliance Engine + 64 Data Services/SMS Proxy)\n- Integration tests   | AC-001–AC-004 | ApplicationRegistryServiceTests (seed + startup) |\n| STORY-018 | 0          | 0                 | N/A (process document only) | |\n| STORY-019 | 9          | 0                 | AC-001–AC-005 | Via observability tests in controller suites |\n| STORY-020 | 0          | 0                 | AC-001–AC-004 | Dynamic App Config toggle — no unit-testable unit without TimeProvider |\n| STORY-021 | 4          | 0                 | AC-001–AC-004 | HealthControllerTests |\n| STORY-022 | 0          | 0                 | Infra-level (Always Encrypted, TLS) — verified via schema review | |\n| STORY-023 | 2          | 0                 | AC-001–AC-002 | DDL trigger and write-only interface verified in AuditLogServiceTests |\n\n### Known Test Gaps\n\n1. **No integration tests:** Full HTTP pipeline tests (real JWT middleware, real EF Core InMemory) were not written. Controller auth (401/403) is asserted via Moq-simulated user context, not real JWT validation middleware.\n\n2. **Cache TTL expiry not tested (STORY-001 AC-004):** Requires a `TimeProvider` abstraction to be injected into `ApplicationRegistryService`. Currently uses `IMemoryCache` directly with wall-clock TTL.\n\n3. **Debug logging toggle not tested (STORY-020):** Dynamic App Configuration polling cannot be unit-tested without a running App Configuration endpoint.\n\n4. **Always Encrypted and TLS enforcement (STORY-022):** Verified by schema review and architecture ADR-003. No automated test can validate column-level encryption without a real Azure SQL instance with CMK/CEK provisioned.\n\n5. **ManualReportTriggerFunction end-to-end:** Authorization enforcement on the Azure Functions HTTP trigger requires a running Functions host to verify.\n\n6. **`WriteOptOutEventAsync`/`WriteBlockedOutboundEventAsync` convenience methods:** Tests use loose-mode Moq; dedicated assertions for `RecordId = Guid.NewGuid()` were not present before CR-005 was fixed in-session.\n\n---\n\n## Review Findings Summary\n\n### Code Review (Agent 10)\n- **Verdict:** APPROVED WITH CONDITIONS\n- **Blocking findings resolved:** 6 of 6 — all resolved during the pipeline review session\n\n| Finding | Description | Resolution |\n|---------|-------------|------------|\n| CR-001 | `CorrelationIdMiddleware` not registered in `Program.cs` | Fixed: `app.UseMiddleware\u003cCorrelationIdMiddleware\u003e()` added after `UseRouting()` |\n| CR-002 | `Request.EnableBuffering()` not called; inbound webhook 100% broken at runtime | Fixed: `app.Use(async (ctx, next) =\u003e { ctx.Request.EnableBuffering(); await next(); })` added before `UseRouting()` |\n| CR-003 | `ComplianceReporting` authorization policy never registered; reporting endpoints 500 | Fixed: `AddPolicy(\"ComplianceReporting\", ...)` added to `AddAuthorizationBuilder()` block |\n| CR-004 | Fire-and-forget in `InboundSmsController` uses disposed scoped services; opt-out processing silently fails | Fixed: `IServiceScopeFactory` used to create independent DI scope for background work |\n| CR-005 | `AuditLogEntry.RecordId` defaults to `Guid.Empty`; PK conflict on second audit insert | Fixed: `Guid.NewGuid()` and `DateTime.UtcNow` assigned in `AuditLogService.LogAsync()` before `AddAsync()` |\n| CR-006 | `AdminController` route `/api/v1/admin/reopt-in` does not match architecture contract `/admin/v1/opt-out/re-opt-in` | Fixed: Route attributes updated to `[Route(\"admin/v1/opt-out\")]` and `[HttpPut(\"re-opt-in\")]` |\n\n- **Open Important findings (must be acknowledged before merge):**\n\n| Finding | File | Description | Recommended Action |\n|---------|------|-------------|-------------------|\n| CR-007 | `InboundSmsHandler.cs` line 3 | Stale `using TCPA.Api.Infrastructure;` directive — compilation warning / potential error | Remove stale using directive before merge |\n| CR-008 | `ReportEmailer.cs` `BuildCsvAttachment` | CSV attachment generates aggregate counts, not per-record detail required by SPEC-013 | Rewrite `BuildCsvAttachment` to emit one row per `ForwardedSmsRecord`/`BlockedSmsRecord` |\n| CR-009 | `ReportingService.cs` lines 236–253 | Compliance failure detection uses a heuristic that produces false positives (re-opted-in numbers flagged) and false negatives (pre-period opt-outs missed) | Replace heuristic with a timestamp-accurate query: for each forwarded message, check `CellNumberOptOutRecord.OptOutTimestamp` ≤ message send time AND no subsequent re-opt-in before send time |\n| CR-010 | `ICorrelationIdAccessor.cs` | Interface in `TCPA.Api.Services.AuditLog` namespace — should be in `TCPA.Api.Services.Observability` | Namespace refactor; purely cosmetic/architectural, no behavior change |\n\n**Note on CR-008 and CR-009:** Both findings affect the weekly compliance report. CR-008 means the CSV attachment sent to Compliance Officers does not contain per-record detail as required by SPEC-013 (regulatorily significant). CR-009 means the compliance failure rate KPI is unreliable. These are rated Important rather than Blocking because the system correctly enforces opt-out; the reporting output is incomplete/inaccurate, not the enforcement. However, they must be resolved before the first scheduled compliance report is delivered (January 2027 at the latest).\n\n### Security Review (Agent 11)\n- **Verdict:** PASS WITH CONDITIONS\n- **Security-Blocking findings resolved:** 2 of 2 — both resolved during the pipeline review session\n\n| Finding | Description | Resolution |\n|---------|-------------|------------|\n| SEC-001 | No API key middleware registered — outbound SMS endpoint unauthenticated | Fixed: `ApiKeyAuthFilter.cs` implemented; `src/TCPA.Api/Infrastructure/Auth/ApiKeyAuthFilter.cs` added; registered in `Program.cs` |\n| SEC-002 | `X-Correlation-ID` header accepted without sanitization — log injection vector | Fixed: `SafeCorrelationId` regex `^[a-zA-Z0-9\\-_]{1,128}<!DOCTYPE html>

    const raw =  added to `CorrelationIdMiddleware.InvokeAsync`; invalid values replaced with `Guid.NewGuid()` |\n\n- **Open High security findings (must be acknowledged with a plan before merge):**\n\n| Finding | File | Description | Required Action |\n|---------|------|-------------|----------------|\n| SEC-003 | `ManualReportTriggerFunction.cs` | `[Authorize]` attribute may not be enforced by Azure Functions runtime — manual report endpoint may be unauthenticated | Confirm `ConfigureFunctionsWebApplication()` + `UseAuthentication()` + `UseAuthorization()` are in Scheduler `Program.cs`; or add manual JWT claim check at function entry |\n| SEC-004 | `ReportingController.cs` / `ReportingService.cs` | Full cell phone numbers returned in API responses from reporting endpoints — not masked | Replace `CellPhoneNumber` with `MaskedCellPhoneNumber` in `ForwardedSmsRecord` and `BlockedSmsRecord` response models; or confirm with Legal that unmasked numbers are required for regulatory reporting |\n| SEC-005 | `AuditLogService.cs` / `AuditLogEntryConfiguration.cs` | `MessageBody` stored without `HasMaxLength()` constraint and without field-level encryption; unbounded write + PII exposure | Apply `HasMaxLength(1600)` migration; evaluate Always Encrypted for `MessageBody` column given TCPA audit requirements |\n\n---\n\n## Fixes Applied During Pipeline\n\nAll six BLOCKING code findings and both SECURITY-BLOCKING findings were resolved during the pipeline session. The following changes were made to source files in-session:\n\n| Finding | File Modified | Change |\n|---------|--------------|--------|\n| CR-001 | `src/TCPA.Api/Program.cs` | Added `app.UseMiddleware\u003cCorrelationIdMiddleware\u003e()` after `app.UseRouting()` |\n| CR-002 | `src/TCPA.Api/Program.cs` | Added `app.Use(async (ctx, next) =\u003e { ctx.Request.EnableBuffering(); await next(); })` before `app.UseRouting()` |\n| CR-003 | `src/TCPA.Api/Program.cs` | Added `AddPolicy(\"ComplianceReporting\", policy =\u003e policy.RequireRole(\"tcpa.compliance_officer\"))` to `AddAuthorizationBuilder()` |\n| CR-004 | `src/TCPA.Api/Controllers/InboundSmsController.cs` | Refactored fire-and-forget to use `IServiceScopeFactory.CreateScope()` for background processing; captures correlation ID before response committed |\n| CR-005 | `src/TCPA.Api/Services/AuditLog/AuditLogService.cs` | `LogAsync()` now assigns `RecordId = Guid.NewGuid()` and `CreatedAt = DateTime.UtcNow` before `AddAsync()`; `AuditLogEntry.RecordId` changed from `init` to `set` accessor |\n| CR-006 | `src/TCPA.Api/Controllers/AdminController.cs` | Route attributes updated: `[Route(\"admin/v1/opt-out\")]`, `[HttpPut(\"re-opt-in\")]`, `[HttpGet(\"status/{cellPhoneNumber}\")]` |\n| SEC-001 | `src/TCPA.Api/Infrastructure/Auth/ApiKeyAuthFilter.cs` (new file) | X-API-Key middleware implementation: per-application key validation from Key Vault, 401 for missing, 403 for invalid, security event logging, key never logged |\n| SEC-001 | `src/TCPA.Api/Program.cs` | Registered `ApiKeyAuthFilter` middleware before `UseRouting()` on `/api/v1/sms/*` routes |\n| SEC-002 | `src/TCPA.Api/Services/Observability/CorrelationIdMiddleware.cs` | Added `SafeCorrelationId` compiled regex; header value validated before use; invalid values replaced with `Guid.NewGuid()` |\n\n---\n\n## Architecture \u0026 Design Notes\n\n1. **Fire-and-forget scope isolation (CR-004 resolution):** The inbound SMS controller returns 200 OK immediately to Cool Text (preventing timeout retries) and dispatches opt-out processing to a background `Task.Run` with a fresh `IServiceScopeFactory`-created DI scope. The correlation ID is captured from the request scope and injected into the new scope\u0027s `CorrelationIdAccessor` before processing begins. This ensures all audit log entries from the background processing carry the correct correlation ID linking them to the originating webhook call.\n\n2. **AuditLog immutability — dual enforcement:** Database-level DDL trigger (`trg_AuditLogEntries_Immutability` in `002_AuditLogImmutabilityTrigger.sql`) rejects all UPDATE/DELETE statements. Application-level enforcement via `IAuditLogService` interface which exposes no Update/Delete methods. Neither layer alone is sufficient for regulatory compliance; both are required.\n\n3. **Always Encrypted — not yet applied:** The EF Core migration creates `CellPhoneNumber` as a plain `nvarchar(20)` column. Always Encrypted (CMK + CEK provisioning in Azure Key Vault) is a post-migration infrastructure step (TASK-061) that requires the platform team. The `Column Encryption Setting=Enabled` connection string parameter is set but will not encrypt data until the platform-side key provisioning is complete. **Do not promote to production until TASK-061 is confirmed complete.**\n\n4. **CCB/My Account inactive by default:** CCB is seeded with `IsActive = false`. The compliance gate treats CCB messages identically to unregistered applications (no enforcement, no audit entry). Activating CCB requires completing the CCB TCPA Activation Gate checklist (end-to-end integration test, Legal sign-off, production smoke test) and a configuration-only deployment to set `IsActive = 1`. See `docs/ccb-activation-gate.md` (TASK-052 deliverable).\n\n5. **`AuditEventType` enum reconciliation required before first build:** `ReportingService.QueryOptedOutAsync` references `AuditEventType.SmsBlocked`; the enum definition in `Domain/AuditEventType.cs` uses `AuditEventType.BlockedOutbound`. **This will not compile.** Change `SmsBlocked` reference in `ReportingService` to `BlockedOutbound` before the first build.\n\n6. **`DomainModels.cs` stub must be deleted:** An earlier agent created `src/TCPA.Api/Domain/DomainModels.cs` as compile-time stubs. The Foundation agent has delivered the authoritative domain model files. The stub file creates naming conflicts. **Delete `src/TCPA.Api/Domain/DomainModels.cs` before the first build.**\n\n7. **Seed script requires placeholder substitution:** `001_ApplicationRegistrationSeed.sql` contains `[PLACEHOLDER: ...]` values for all five Cool Text account IDs and callback URLs. These must be replaced with production values from Azure Key Vault before the seed script is run in any environment. The script will fail with constraint violations if placeholders are not replaced.\n\n8. **Opt-out confirmation SMS text — Legal approval pending:** The confirmation message text is loaded from `TCPA:OptOutConfirmationSmsText` in Azure Key Vault at dispatch time (not hardcoded). The key must contain the legally-approved text before go-live. A missing or empty key will cause `ConfirmationDispatcher` to log a critical error and skip sending the confirmation, which is a TCPA violation.\n\n---\n\n## Deployment Notes\n\n- [x] **Database migrations required:** Yes — `20260626000001_InitialSchema.cs` creates all four tables. Run via `dotnet ef database update` before first start.\n- [x] **SQL seed scripts required:** Yes — run `001_ApplicationRegistrationSeed.sql` (after substituting placeholders from Key Vault) and `002_AuditLogImmutabilityTrigger.sql` post-migration.\n- [x] **Always Encrypted column provisioning required:** Yes — TASK-061 (platform team action). CMK and CEK must be provisioned in Azure Key Vault and applied to `CellPhoneNumber` columns before production use. See migration header comment for details.\n- [x] **Azure Key Vault secrets required before start:**\n  - `CoolText:ApiKey` — Cool Text platform API key\n  - `CoolText:WebhookSecret` — HMAC signing secret (pending vendor confirmation per STORY-003-SPIKE)\n  - `TCPA:OptOutConfirmationSmsText` — Legal-approved opt-out confirmation message text\n  - `Reporting:SmtpPassword` — SMTP relay credential\n  - `Reporting:RecipientList` — Compliance Officer distribution list (pending CQ-004 resolution)\n  - `ApplicationRegistry:*:CoolTextAccountId` — Per-application Cool Text account IDs (5 entries)\n- [x] **Azure App Configuration required:**\n  - `Authentication:AdminApi:Authority` — Azure AD / Entra ID OIDC endpoint (pending STORY-008 spike)\n  - `Logging:MinimumLevel` — defaults to `Information`; set to `Debug` for troubleshooting (triggers 2-hour alert)\n- [x] **Environment variable changes:** None — all configuration via Azure Key Vault and App Configuration.\n- [x] **Breaking API changes:** N/A — this is a new service.\n- [x] **CCB integration:** CCB/My Account is registered with `IsActive = false`. No SCG application should route CCB messages through this API until the CCB TCPA Activation Gate process is completed.\n- [x] **Rollback procedure:** The service is stateless except for the Azure SQL database. To rollback: (1) redirect upstream application traffic back to Cool Text directly (restore pre-TCPA-API routing); (2) retain the database — opt-out records written before rollback remain valid; (3) the EF Core down-migration (`dotnet ef database update 0`) will drop all tables — **do not run unless all opt-out data has been exported first**.\n\n---\n\n## Out of Scope (Not in This PR)\n\nPer `outputs/requirements.md` Out of Scope section and pipeline decisions:\n\n| ID      | Item                                                                 | Source         |\n|---------|----------------------------------------------------------------------|----------------|\n| OOS-001 | Initial customer opt-in to text messaging (remains at application level) | PRD §6       |\n| OOS-002 | Automated re-opt-in after opt-out                                    | PRD §6         |\n| OOS-003 | Program/campaign-specific message creation                           | PRD §6         |\n| OOS-004 | Solutions for entities outside Southern Company Gas                  | PRD §6         |\n| OOS-005 | Emergency SMS notifications                                          | PRD §6         |\n| OOS-006 | Vendor-managed SMS (ACI SpeedPay, Google Notifications)              | PRD §6         |\n| OOS-007 | IVR Dialer SMS                                                       | PRD §6         |\n| OOS-008 | Multi-factor authentication SMS                                      | PRD §6         |\n| OOS-009 | Application-level opt-out propagating to TCPA API                   | PRD §6         |\n| OOS-010 | Opt-out status push from TCPA API back to applications (removed Phase 1) | PRD §6     |\n| —       | UI for Help Desk re-opt-in workflow                                  | RISK-011 (Phase 2) |\n| —       | Self-service Compliance Officer report UI                            | STORY-016 notes (Phase 2) |\n| —       | Archived audit record query path (\u003e90 days, Blob Storage)            | Phase 2        |\n| —       | Rate limiting (deferred per ADR-002)                                 | SEC-009 / RISK-016 |\n| —       | `MailKit` replacement for `SmtpClient`                               | SEC-012 (Low)  |\n\n---\n\n## Pre-Merge Checklist (Reviewer Actions Required)\n\n- [ ] Confirm CR-007 (stale `using` directive in `InboundSmsHandler.cs`) is removed before merge\n- [ ] Confirm CR-008 (CSV attachment per-record format) has a documented remediation plan with sprint commitment — regulatory report content is a compliance requirement\n- [ ] Confirm CR-009 (compliance failure detection logic) has a documented remediation plan — this drives the KPI sent to the Compliance Officer\n- [ ] Confirm CR-010 (namespace placement) is acceptable for Phase 1 or scheduled for Sprint 2 cleanup\n- [ ] Confirm SEC-003 (manual report trigger authorization) — verify `ConfigureFunctionsWebApplication()` is in Scheduler startup; or open a follow-on task with a committed date\n- [ ] Confirm SEC-004 (full phone numbers in reporting API responses) — confirm with Legal/Compliance whether unmasked cell numbers are required in compliance report API responses; if not, apply masking before merge\n- [ ] Confirm SEC-005 (`MessageBody` storage) — confirm with Legal whether full SMS body must be retained for compliance; if so, evaluate field-level encryption; apply `HasMaxLength(1600)` regardless\n- [ ] `AuditEventType.SmsBlocked` reference in `ReportingService.cs` corrected to `AuditEventType.BlockedOutbound` (will not compile otherwise)\n- [ ] `src/TCPA.Api/Domain/DomainModels.cs` stub deleted (will cause naming conflicts)\n- [ ] `001_ApplicationRegistrationSeed.sql` placeholder values confirmed replaced with Key Vault values before any deployment\n- [ ] Always Encrypted (TASK-061) confirmed tracked as a pre-production gate item\n- [ ] STORY-003-SPIKE outcome confirmed — Cool Text webhook HMAC signing mechanism confirmed with vendor\n- [ ] STORY-007 (BizTalk spike) outcome confirms BizTalk integration test slot reserved for Q3 2026\n- [ ] STORY-008 (Admin IdP spike) confirms Azure AD / Entra ID OIDC endpoint and RBAC roles provisioned\n- [ ] Legal/Compliance has approved the opt-out confirmation SMS text and it is loaded into `TCPA:OptOutConfirmationSmsText` in Key Vault\n- [ ] `Reporting:RecipientList` confirmed with Compliance team (CQ-004)\n- [ ] No sensitive files modified: `.tf`, `.bicep`, `.yml`, `.yaml`, `.cfn`, `.env` — confirmed not present in `src/`\n- [ ] No credentials, secrets, or unmasked PII in code or tests — confirmed by Security Agent checklist\n- [ ] Documentation is accurate and updated — `outputs/docs/` reviewed by Architecture Lead\n- [ ] Deployment notes complete — reviewed by Platform Engineering\n";
